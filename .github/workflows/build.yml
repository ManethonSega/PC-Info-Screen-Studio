name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\PCInfoScreenStudio.slnx

      - name: Build
        run: dotnet build .\PCInfoScreenStudio.slnx -c Release --no-restore

      - name: Check controller workflows without a physical display
        run: dotnet run --project .\tests\PCInfoScreenStudio.ControllerChecks\PCInfoScreenStudio.ControllerChecks.csproj -c Release --no-build -- --capture-ui .\artifacts\ui-preview

      - name: Upload interface previews for review
        uses: actions/upload-artifact@v7
        with:
          name: PCInfoScreenStudio-ui-preview
          path: .\artifacts\ui-preview\
          retention-days: 3

      - name: Publish self-contained Windows x64 build
        run: dotnet publish .\src\PCInfoScreenStudio.App\PCInfoScreenStudio.App.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\win-x64 -p:PublishSingleFile=false -p:PublishTrimmed=false

      - name: Bundle official PawnIO prerequisite
        shell: pwsh
        run: |
          $dir = ".\artifacts\win-x64\Prerequisites"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $url = "https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe"
          $installer = Join-Path $dir "PawnIO_setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer

          $expected = "1f519a22e47187f70a1379a48ca604981c4fcf694f4e65b734aaa74a9fba3032"
          $actual = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            Remove-Item $installer -Force -ErrorAction SilentlyContinue
            throw "PawnIO installer SHA-256 mismatch. Expected $expected, got $actual."
          }

          Write-Host "Bundled verified PawnIO 2.2.0 installer: $actual"

      - name: Smoke test published application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\artifacts\win-x64\PCInfoScreenStudio.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "PCInfoScreenStudio\Logs\startup.log"
            if (Test-Path $log) {
              Get-Content $log
            }
            throw "Published application smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Package and verify portable alpha ZIP
        shell: pwsh
        run: ./scripts/New-PortablePackage.ps1 -SourceCommit "${{ github.sha }}" -WorkflowUrl "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Free artifact storage while preserving the newest build
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'PCInfoScreenStudio-win-x64',
                per_page: 100
              }
            );

            artifacts.sort(
              (left, right) => new Date(right.created_at) - new Date(left.created_at)
            );

            for (const artifact of artifacts.slice(1)) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted old artifact ${artifact.id} from ${artifact.created_at}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Artifact ${artifact.id} was already removed`);
                  continue;
                }
                throw error;
              }
            }

      - name: Upload self-contained build
        uses: actions/upload-artifact@v7
        with:
          name: PCInfoScreenStudio-win-x64
          path: .\artifacts\win-x64\
          if-no-files-found: error
          retention-days: 3

      - name: Keep only the build from this workflow run
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'PCInfoScreenStudio-win-x64',
                per_page: 100
              }
            );

            const currentRunId = Number(context.runId);
            const currentArtifact = artifacts.find(
              artifact => Number(artifact.workflow_run?.id) === currentRunId
            );

            if (!currentArtifact) {
              core.setFailed('The artifact uploaded by this workflow run could not be found.');
              return;
            }

            for (const artifact of artifacts) {
              if (artifact.id === currentArtifact.id) {
                continue;
              }

              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted superseded artifact ${artifact.id} from ${artifact.created_at}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Artifact ${artifact.id} was already removed`);
                  continue;
                }
                throw error;
              }
            }

      - name: Publish requested portable alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [xml]$project = Get-Content ./src/PCInfoScreenStudio.App/PCInfoScreenStudio.App.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          $title = "PC Info Screen Studio $version (portable alpha)"
          $zip = "./artifacts/release/PCInfoScreenStudio-$version-win-x64.zip"
          $checksums = "./artifacts/release/SHA256SUMS.txt"
          $notes = "./docs/releases/$version.md"
          if (!(Test-Path $zip) -or !(Test-Path $checksums) -or !(Test-Path $notes)) { throw 'Reviewed release files are missing.' }
          gh release view $tag --repo "${{ github.repository }}" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Existing releases are not overwritten." }
          gh release create $tag $zip $checksums --repo "${{ github.repository }}" --target "${{ github.sha }}" --title $title --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
